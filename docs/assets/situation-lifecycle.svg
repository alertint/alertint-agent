<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 500" role="img" aria-labelledby="title description">
  <title id="title">Situation lifecycle and investigation handoff</title>
  <desc id="description">Active moves to Recovery pending when every member alert is authoritatively clear. Recovery pending moves to Recovered after the grace period if alerts stay clear, or returns to Active on a refire. Active or Recovery pending can instead end with recovery unconfirmed when source truth is missing through its lifecycle deadline. Later firing after either terminal outcome opens a new linked Situation. Investigation is a separate loop: A requests work, and B returns a finding without changing the source lifecycle.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #203139; }
    .heading { font-size: 17px; font-weight: 700; }
    .state { fill: #fff; stroke: #71878e; stroke-width: 2; }
    .active { fill: #eef7f4; stroke: #246858; }
    .pending { fill: #fff8ec; stroke: #a47734; }
    .recovered { fill: #edf7ef; stroke: #37724b; }
    .unknown { fill: #fff8ec; stroke: #a47734; }
    .title { font-size: 17px; font-weight: 700; }
    .sub { font-size: 12px; fill: #536770; }
    .transition { fill: none; stroke: #71878e; stroke-width: 2; marker-end: url(#arrow); }
    .edge-label { font-size: 12px; fill: #405961; paint-order: stroke; stroke: #fff; stroke-width: 6px; stroke-linejoin: round; }
    .handoff { fill: none; stroke: #665486; stroke-width: 2; stroke-dasharray: 8 4 2 4; marker-end: url(#handoff-arrow); }
    .port { fill: #f2f0f8; stroke: #665486; stroke-width: 2.5; }
    .port-letter { fill: #46385f; font-size: 19px; font-weight: 800; }
    .port-label { fill: #46385f; font-size: 12px; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#71878e"/></marker>
    <marker id="handoff-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#665486"/></marker>
  </defs>

  <text class="heading" x="60" y="24">One episode · source lifecycle</text>

  <path class="transition" d="M270 132 H420"/>
  <text class="edge-label" x="345" y="117" text-anchor="middle">All member alerts clear</text>
  <path class="transition" d="M630 132 H770"/>
  <text class="edge-label" x="700" y="117" text-anchor="middle">Grace expires; still clear</text>
  <path class="transition" d="M480 95 V55 H165 V95"/>
  <text class="edge-label" x="320" y="44" text-anchor="middle">Refire before terminal end</text>
  <path class="transition" d="M165 169 V300 H470 V350"/>
  <text class="edge-label" x="295" y="292" text-anchor="middle">Deadline + missing source truth</text>
  <path class="transition" d="M575 169 V350"/>
  <text class="edge-label" x="684" y="260" text-anchor="middle">Truth lost through deadline</text>
  <path class="transition" d="M875 169 V350"/>
  <text class="edge-label" x="875" y="260" text-anchor="middle">Later firing → new Situation</text>
  <path class="transition" d="M630 387 H770"/>
  <text class="edge-label" x="700" y="373" text-anchor="middle">Later firing</text>

  <rect class="state active" x="60" y="95" width="210" height="74" rx="10"/>
  <text class="title" x="75" y="124">Active</text>
  <text class="sub" x="75" y="147">Known gaps + actual next step</text>

  <rect class="state pending" x="420" y="95" width="210" height="74" rx="10"/>
  <text class="title" x="435" y="124">Recovery pending</text>
  <text class="sub" x="435" y="147">All clear; stability not yet proven</text>

  <rect class="state recovered" x="770" y="95" width="210" height="74" rx="10"/>
  <text class="title" x="785" y="124">Recovered</text>
  <text class="sub" x="785" y="147">Alerts recovered; tracking ended</text>

  <rect class="state unknown" x="420" y="350" width="210" height="74" rx="10"/>
  <text class="title" x="435" y="379">Tracking ended</text>
  <text class="sub" x="435" y="402">Recovery unconfirmed</text>

  <rect class="state" x="770" y="350" width="210" height="74" rx="10"/>
  <text class="title" x="785" y="379">New linked episode</text>
  <text class="sub" x="785" y="402">A different Situation</text>

  <path class="handoff" d="M105 169 V207"/>
  <circle class="port" cx="105" cy="230" r="23"/>
  <text class="port-letter" x="105" y="237" text-anchor="middle">A</text>
  <text class="port-label" x="105" y="267" text-anchor="middle">Request investigation</text>
  <path class="handoff" d="M307 230 H290 V185 L250 169"/>
  <circle class="port" cx="330" cy="230" r="23"/>
  <text class="port-letter" x="330" y="237" text-anchor="middle">B</text>
  <text class="port-label" x="330" y="267" text-anchor="middle">Finding returns; still Active</text>

  <text class="sub" x="60" y="470">A and B are work handoffs, not lifecycle transitions. Terminal Situations never reopen.</text>
</svg>
