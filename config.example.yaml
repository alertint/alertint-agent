receivers:
  address: "0.0.0.0:9911"   # shared inbound webhook bind address; ALL receivers (alertmanager, change) mount here

alertmanager:
  enabled: true
  webhook_token_env: ALERTINT_WEBHOOK_TOKEN   # name of the env var holding the bearer token

storage:
  sqlite_path: ./alertint-agent.db

llm:
  provider: anthropic
  api_key_env: ANTHROPIC_API_KEY              # name of the env var holding the Anthropic key
  model: claude-sonnet-5                      # default: strongest reasoning in its price class
  # model: claude-haiku-4-5                   # faster + cheaper alternative for cost-sensitive setups
  timeout_seconds: 120                        # whole-request LLM timeout; local endpoints typically want 300

  # Self-hosted alternative — any OpenAI-compatible endpoint (SGLang, vLLM,
  # Ollama, LM Studio). See docs/integrations/openai-compatible.md.
  # provider: openai-compatible
  # base_url: http://localhost:30000          # endpoint root; a trailing /v1 also works
  # model: qwen3-32b                          # the model name your endpoint serves
  # response_format: json_object              # default; "off" if your runtime lacks enforced JSON
  # thinking: false                           # enabling thinking? raise max_tokens to 8000-16000 or
  #                                           # triage fails loud: "llm: response truncated at max_tokens"

correlator:
  window_seconds: 90       # group alerts arriving within this window
  min_alerts: 1            # minimum alerts to form an incident (1 = single-alert triage)
  # Optional override. Omit or leave empty to use the Receiver's grouping:
  # Alertmanager groupLabels, or technical host for Zabbix.
  # group_labels: [cluster, namespace, service]

memory:                    # incident memory: recurrence collapse (always on, deterministic, free)
  attach_window_minutes: 30   # Clock A: re-fires within this window of the last one attach instead of re-triaging
  judgment_ceiling_hours: 4   # Clock B: force a fresh re-judgment once this long since the last one, even if still collapsing
  occurrence_cap: 100         # backstop: re-judge after this many attaches since the last judgment
  lookback_days: 90           # occurrence retention + how far back recurrence history is counted
  classifier:                 # M3 shadow classifier: fuzzy "same condition?" match on weak-signal recalls — dark by default
    mode: "off"               # off | shadow | on — quote it; bare off/on are YAML booleans (see docs before flipping to on)
    timeout_seconds: 10       # seconds-scale budget for the classifier's own Haiku call

# Triage pipeline tunables. The verification round adds a second LLM pass that
# falsifies the draft verdict (a floor + model-proposed disprove-queries)
# before persisting it. See docs/getting-started/configuration.md#triage.
triage:
  verification:
    enabled: true                # kill-switch; omit or true = on, false = single-call triage (no verification)
    max_queries: 4                # cap on model-proposed disprove-queries (the deterministic floor always runs)
    query_timeout_seconds: 10     # budget for the query phase, sliced per query
    max_rounds: 1                 # reserved for future multi-round verification; only 1 is accepted today
  extra_selector_labels: []       # extra topology label keys (e.g. [cluster]) joined to every evidence/verification query; extend-only, never dropped by fallbacks

# Proactive Situation controller — the durable L2 aggregate that owns Attention,
# lifecycle, and the one evolving Slack thread per operational episode. It is
# not a feature flag: every accepted Alert delivery always attaches to a
# Situation, and it is the only Slack writer in this build. See
# docs/concepts/architecture.md and docs/getting-started/configuration.md#situations.
situations:
  workers: 2                        # durable reconciliation workers claiming due Situations
  reconcile_interval_seconds: 1     # how often idle workers poll for due work
  lease_seconds: 300                # claim lease duration; an expired lease is recovered on restart or by another worker
  lease_heartbeat_seconds: 30       # how often an in-progress attempt renews its lease; must be less than lease_seconds

  recovery_grace:                   # how long a Situation waits in recovery_pending before turning green
    webhook_seconds: 120            # fixed grace for webhook-delivered sources (used for every source in this build — see docs)
    polling_min_seconds: 120        # lower clamp for a polling source's grace (2x its poll interval)
    polling_max_seconds: 600        # upper clamp for a polling source's grace

  cadence:                          # ordinary observing-checkpoint spacing, fastest to slowest
    fast_seconds: 60
    normal_seconds: 300
    slow_seconds: 900

  budgets:                          # per-attempt caps bounding one reconciliation attempt
    max_observation_calls: 6        # bounded connector reads per attempt
    max_l1_llm_calls: 2             # acute-triage (L1) model calls per attempt
    max_l2_llm_calls: 2             # Situation Assessment (L2) model calls per attempt
    attempt_wall_seconds: 180       # wall-clock ceiling for one attempt
    max_attempts_per_input: 5       # exhausted attempts on one unchanged input park work rather than force terminality
    connector_concurrency: 4        # concurrent connector reads across all in-flight attempts
    llm_concurrency: 2              # concurrent LLM calls across all in-flight attempts

  retry:                            # exponential backoff for retryable connector/LLM failures
    initial_seconds: 5
    maximum_seconds: 300
    jitter_percent: 20              # +/-20% jitter to avoid retry stampedes

  slack:
    repage_cooldown_seconds: 900        # minimum spacing between a materially-changed required-action re-page
    broadcast_on_criticality_change: true  # a newly crossed deterministic critical floor always earns a broadcast reply

  dependency_health:
    broadcast_after_seconds: 300    # how long a shared dependency (LLM, a connector) must stay degraded before one installation-level health root posts

  envelope_review:
    reminder_interval_days: 30      # at most one sparse Expected-behaviour envelope confirmation reminder per this many days

notify:
  stdout: true             # always emit one JSON line per finding to stdout
  slack:
    enabled: false
    bot_token_env: SLACK_BOT_TOKEN   # xoxb- bot token (requires chat:write scope)
    channel: "#alerts"               # channel name or ID
    min_severity: low                # low | medium | high — outward-only floor on new main-channel Situation pokes, compared against a deterministic Interruption priority (critical always passes); never affects ingestion, Assessment, or MCP visibility. See docs/notifications/slack.md.
    recurrence_mode: change-gated    # change-gated (default) | off — how a recurring symptom resurfaces in its Situation's thread; off = silent root count-bump only

# MCP HTTP server — AI coding agents connect to http://host:9912/mcp
# Presence-based: set ALERTINT_MCP_TOKEN to a long random secret and the
# server turns ON automatically, so `alertint drill` can fetch its finding
# and your agent can read incidents out of the box.
mcp:
  # enabled: false           # uncomment to force OFF even when the token is set
  addr: "0.0.0.0:9912"
  token_env: ALERTINT_MCP_TOKEN

# Rule packs — the embedded baseline pack always loads; point local_pack_dir
# at a directory (pack.yaml + rules/*.yaml + templates/*.md) to add or
# override rules. See docs/rules-spec.md and examples/rules/.
rules:
  # local_pack_dir: ./my-rules

# Prometheus read connector — enriches triage prompts with live metric values
# and exposes read-only PromQL MCP tools. Presence-based: setting base_url
# turns it ON automatically.
prometheus:
  # base_url: http://localhost:9090            # set this and Prometheus enrichment turns ON automatically
  # enabled: false                              # uncomment to force OFF even when base_url is set
  # bearer_token_env: PROMETHEUS_BEARER_TOKEN   # only if Prometheus requires auth
  # org_id: tenant-1                            # only for multi-tenant Mimir/Cortex — sent as X-Scope-OrgID
  timeout_seconds: 10
  default_range_minutes: 60

# Log enrichment connector (Loki / Grafana Cloud) — pulls recent log lines into
# the triage prompt and exposes a read-only loki_query_range MCP tool.
#
# IMPORTANT: alert labels are NOT Loki stream labels. `service` is often `app`;
# `job`/`instance` usually have no stream-label equivalent. Map them with
# label_map or the selector matches zero streams (you'll see an info log
# "returned no lines — check loki.label_map"). See docs/integrations/loki.md →
# "Map your labels".
# Presence-based: setting loki.base_url turns log enrichment ON automatically.
logs:
  # enabled: false           # uncomment to force OFF even when loki.base_url is set
  provider: loki
  timeout_seconds: 10        # TOTAL budget for the whole fetch (filtered + fallback)
  default_range_minutes: 15  # look-back window before the first alert
  max_lines: 50
  loki:
    # base_url: http://loki:3100           # set this and log enrichment turns ON (or https://logs-prod-006.grafana.net for Grafana Cloud)
    auth:
      mode: none                           # none | bearer | basic
      # token_env: LOKI_BEARER_TOKEN       # bearer mode
      # username: "123456"                 # basic mode: Grafana Cloud user/instance ID
      # password_env: GRAFANA_CLOUD_LOKI_TOKEN  # basic mode: Access Policy token (logs:read)
    # org_id: "tenant-a"                    # optional X-Scope-OrgID (self-hosted multi-tenant)
    # line_filter: '|~ "(?i)(error|warn|fatal|panic|fail)"'  # default; set "" to disable
    label_map:                             # alert-label key → Loki stream-label key
      service: app                         #   alert `service` → stream `app`
      instance: ""                         #   drop: no stream-label equivalent

# Change events: push deploy/config/flag events over a webhook so triage can
# answer "what changed right before this?". See docs/integrations/changes.md.
# Enrichment is presence-based: it turns ON automatically as soon as a change
# source exists (changes.ingress or the Sentry releases poller below).
# Enabled here so a one-line curl at the end of a deploy gives triage causal
# evidence — and so the flagship `alertint drill` scenario can plant its fake
# deploy. Set ALERTINT_CHANGES_WEBHOOK_TOKEN before starting (required when
# enabled).
changes:
  ingress:                                 # Role A: receive change webhooks (write surface)
    enabled: true
    webhook_token_env: ALERTINT_CHANGES_WEBHOOK_TOKEN
  enrichment:                              # Role B: use stored changes (triage prompt + MCP)
    # enabled: false                       # uncomment to force OFF even when a change source is on
    window_minutes: 120                    # look-back before the first alert
    max_events: 10                         # cap on ranked changes attached to a prompt
  retention_days: 30                       # prune changes older than this

# Zabbix connector — two independently-enableable roles:
#   ingress → push Receiver: native /webhook/zabbix problem/resolution events
#   api     → pull Source: read-only context enrichment (operator knowledge,
#             CMDB/topology, problem detail) + zabbix_metric_history /
#             zabbix_host_problems MCP tools. Presence-based: setting
#             base_url turns it on. See docs/integrations/zabbix.md.
zabbix:
  ingress:
    enabled: false
    webhook_token_env: ALERTINT_ZABBIX_WEBHOOK_TOKEN   # bearer token Zabbix presents to /webhook/zabbix
  api:
    # enabled: false                       # uncomment to force OFF even when base_url is set
    base_url: https://zbx.example.com      # Zabbix frontend root; /api_jsonrpc.php is appended
    api_token_env: ZABBIX_API_TOKEN        # env var holding a read-only API token (Administration → API tokens)
    timeout_seconds: 10                    # per-request HTTP timeout
    default_range_minutes: 60              # zabbix_metric_history default look-back when start is omitted
    history_retention_days: 7              # windows older than this fall back to hourly trends
    flap_window_hours: 24                  # look-back for the trigger flap count
    host_label: host                       # alert label carrying the Zabbix technical host name

# Sentry connector — two read-only roles over one shared connection/token:
#   releases  → Change source: polls deploys/releases into the change plane
#   issues    → Error source: at triage, attaches the exception + file:line,
#               blast radius, and NEW-in-window flag for the incident's service.
# Disabled by default; with both off, AlertINT makes no Sentry calls.
# See docs/integrations/sentry.md.
sentry:
  base_url: https://sentry.io                # host root (SaaS EU: https://de.sentry.io)
  org: my-org-slug                           # your Sentry organization slug
  token_env: SENTRY_AUTH_TOKEN               # env var holding the token (never inline)
  timeout_seconds: 10                        # per-request HTTP timeout
  releases:                                  # Change source (needs project:read)
    enabled: false
    poll_interval_seconds: 60
    initial_lookback_minutes: 60             # first run seeds the watermark this far back
    release_scan_horizon_days: 30            # oldest release still scanned for new deploys
    # projects: ["checkout", "payments"]     # optional; omit for org-wide
  issues:                                    # Error source (needs event:read)
    enabled: false
    lookback_minutes: 30                     # W = [first_alert − lookback, now]
    max_issues: 3                            # top issues rendered (the K of the 1+K budget)
    fetch_timeout_seconds: 15                # bounds the WHOLE 1+K fetch
    include_message: true                    # include the exception message across prompt/SQLite/MCP

log_level: info            # debug | info | warn | error
log_format: auto           # auto | console | json (auto → console on a TTY, json otherwise)
