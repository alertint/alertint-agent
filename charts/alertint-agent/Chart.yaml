apiVersion: v2
name: alertint-agent
description: AI-powered alert-triage agent that correlates Alertmanager/Zabbix alerts into incidents, enriches them with Mimir/Loki/Sentry evidence, and produces LLM findings.
type: application
version: 0.2.5
appVersion: "0.14.1"
icon: https://raw.githubusercontent.com/alertint/alertint-agent/main/docs/assets/alertint-logo.svg
home: https://alertint.com
sources:
  - https://github.com/alertint/alertint-agent
keywords:
  - alerting
  - incident-management
  - observability
  - llm
maintainers:
  - name: AlertINT maintainers
    email: ernests@alertint.com
    url: https://github.com/alertint/alertint-agent
# Artifact Hub listing metadata. Keep artifacthub.io/images in sync with
# appVersion (scripts/chart-release-prep.sh rewrites it; the release
# workflow's validate step refuses a mismatch) and roll
# artifacthub.io/changes for every chart release (see RELEASING.md).
# Reference: https://artifacthub.io/docs/topics/annotations/helm/
annotations:
  artifacthub.io/license: FSL-1.1-ALv2
  artifacthub.io/category: monitoring-logging
  artifacthub.io/images: |
    - name: alertint-agent
      image: ghcr.io/alertint/alertint-agent:v0.14.1
  artifacthub.io/links: |
    - name: Documentation
      url: https://alertint.com/docs/
    - name: Chart changelog
      url: https://github.com/alertint/alertint-agent/blob/main/charts/alertint-agent/CHANGELOG.md
    - name: Releasing
      url: https://github.com/alertint/alertint-agent/blob/main/RELEASING.md
  artifacthub.io/changes: |
    - kind: changed
      description: Update the default alertint-agent image to v0.14.1
