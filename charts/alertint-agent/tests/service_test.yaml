suite: service
templates:
  - service.yaml
tests:
  - it: uses the default ports and named targetPorts
    asserts:
      - equal:
          path: spec.ports
          value:
            - port: 9911
              targetPort: webhook
              protocol: TCP
              name: webhook
            - port: 9912
              targetPort: mcp
              protocol: TCP
              name: mcp

  - it: honors custom Service ports while targetPort stays a fixed name
    set:
      service.webhookPort: 8080
      service.mcpPort: 8081
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 8080
      - equal:
          path: spec.ports[0].targetPort
          value: webhook
      - equal:
          path: spec.ports[1].port
          value: 8081
      - equal:
          path: spec.ports[1].targetPort
          value: mcp

  - it: merges custom labels onto the Service alongside the chart's standard labels
    set:
      service.labels:
        team: sre
    asserts:
      - equal:
          path: metadata.labels.team
          value: sre
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: alertint-agent

  - it: lets a custom label override a standard one of the same name
    set:
      service.labels:
        app.kubernetes.io/name: overridden
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: overridden
