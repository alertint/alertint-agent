name: Artifact Hub Metadata

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: publish and verify repository metadata
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up ORAS
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1
        with:
          version: 1.3.4

      - name: Log in to GitHub Container Registry
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | oras login ghcr.io --username "$GHCR_USER" --password-stdin

      - name: Publish Artifact Hub repository metadata
        run: |
          oras push ghcr.io/alertint/charts/alertint-agent:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml

      - name: Verify published metadata
        run: |
          oras pull ghcr.io/alertint/charts/alertint-agent:artifacthub.io \
            --output "$RUNNER_TEMP/artifacthub-metadata"
          cmp artifacthub-repo.yml "$RUNNER_TEMP/artifacthub-metadata/artifacthub-repo.yml"
