name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: goreleaser
    runs-on: ubuntu-latest
    outputs:
      publish_chart: ${{ steps.release-config.outputs.publish_chart }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Changelog gate: the GitHub Release body is the CHANGELOG.md section for
      # this tag. No section -> no release; roll the changelog first with
      # `task release:prep VERSION=<x.y.z>` (see RELEASING.md).
      - name: Extract release notes from CHANGELOG.md
        run: ./scripts/release-notes.sh "${GITHUB_REF_NAME}" > /tmp/release-notes.md

      - name: Select release configuration
        id: release-config
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc[1-9][0-9]*$ ]]; then
            echo "config=.goreleaser.rc.yaml" >>"$GITHUB_OUTPUT"
            echo "publish_chart=false" >>"$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "config=.goreleaser.yaml" >>"$GITHUB_OUTPUT"
            echo "publish_chart=true" >>"$GITHUB_OUTPUT"
          else
            echo "unsupported release tag: ${GITHUB_REF_NAME}" >&2
            exit 64
          fi

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          check-latest: false

      - name: Set up QEMU (for arm64 Docker builds)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean --config ${{ steps.release-config.outputs.config }} --release-notes /tmp/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-chart:
    name: publish Helm chart
    needs: release
    if: ${{ needs.release.outputs.publish_chart == 'true' }}
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing in the called workflow
    uses: ./.github/workflows/chart-release.yml
