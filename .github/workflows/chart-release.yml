name: Chart Release

on:
  push:
    tags:
      - "chart-v*"
  workflow_call:

# id-token lets cosign obtain a GitHub OIDC identity for keyless signing; no
# signing key is stored anywhere. A caller via workflow_call must grant it too.
permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    name: publish OCI chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.16.4"

      - name: Set up cosign
        uses: sigstore/cosign-installer@v3

      - name: Validate release metadata
        run: ./scripts/chart-release-validate.sh "${GITHUB_REF_NAME}"

      - name: Lint chart
        run: |
          helm lint charts/alertint-agent \
            --set secret.create=true \
            --set secret.data.ALERTINT_WEBHOOK_TOKEN=test \
            --set secret.data.ANTHROPIC_API_KEY=test

      - name: Package chart
        run: helm package charts/alertint-agent --destination dist

      # A chart-only release must not point at an application image that was
      # never published. For a normal release this also confirms the preceding
      # GoReleaser job completed the multi-architecture image manifest.
      - name: Log in to GitHub Container Registry for image verification
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Verify referenced application image
        run: |
          app_version="$(sed -n 's/^appVersion: *"\{0,1\}\([^" ]*\)"\{0,1\}$/\1/p' charts/alertint-agent/Chart.yaml)"
          docker manifest inspect "ghcr.io/alertint/alertint-agent:v${app_version}" >/dev/null

      - name: Log in to GitHub Container Registry for Helm
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      # Helm infers alertint-agent:<Chart.yaml version> from the packaged chart;
      # the push destination intentionally omits both chart name and tag.
      - name: Push chart
        id: push
        run: |
          set -o pipefail
          chart_version="$(sed -n 's/^version: *//p' charts/alertint-agent/Chart.yaml)"
          helm push "dist/alertint-agent-${chart_version}.tgz" oci://ghcr.io/alertint/charts \
            | tee "$RUNNER_TEMP/helm-push.log"
          digest="$(sed -n 's/^Digest: *//p' "$RUNNER_TEMP/helm-push.log")"
          [ -n "$digest" ] || { echo "::error::helm push did not report a digest"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # Keyless signing: the certificate is bound to this workflow's GitHub
      # OIDC identity and recorded in the Rekor transparency log. Artifact Hub
      # detects the signature and shows the "signed" badge; users verify with
      # the command in the chart README. Registry credentials come from the
      # docker/login-action step above.
      - name: Sign chart with cosign
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "ghcr.io/alertint/charts/alertint-agent@${DIGEST}"

      # For a chart-only release the identity ref is refs/tags/chart-vX.Y.Z;
      # when called from release.yml it is refs/tags/vX.Y.Z (the reusable
      # workflow keeps its own path, the ref is the caller's tag).
      - name: Verify chart signature
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign verify \
            --certificate-identity-regexp '^https://github\.com/alertint/alertint-agent/\.github/workflows/chart-release\.yml@refs/tags/' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "ghcr.io/alertint/charts/alertint-agent@${DIGEST}" >/dev/null
